# SPDX-License-Identifier: MIT
#
# Runs the test suite on both systems the flake supports, on every push to
# main and on every pull request: the flake's checks, the lockfiles a build
# must refuse, a relock of the fixtures that must reproduce them byte for
# byte, and the README's quickstart on ripgrep.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Flake checks
        run: nix flake check --print-build-logs
      - name: Lockfiles a build must refuse
        run: nix shell 'nixpkgs#xxd' 'nixpkgs#python3' -c tests/negative.sh
      - name: Relock the fixtures
        run: |
          tests/relock-fixtures.sh
          git diff --exit-code
      # The quickstart word for word, with the pushed commit, on ripgrep
      # 14.1.1: the lockfile must match the one the integration checks build.
      - name: Quickstart on ripgrep
        if: github.event_name == 'push'
        run: |
          git clone --quiet https://github.com/BurntSushi/ripgrep "$RUNNER_TEMP/ripgrep"
          cd "$RUNNER_TEMP/ripgrep"
          git checkout --quiet 4649aa9700619f94cf9c66876e9549d83420e16c
          SECONDS=0
          nix run "github:${{ github.repository }}/${{ github.sha }}" -- purify
          echo "cargo purify took ${SECONDS}s"
          cmp cargo-purifier.lock.json "$GITHUB_WORKSPACE/tests/projects/ripgrep/cargo-purifier.lock.json"
